# Phase 2 — Authelia + Postgres + Redis (profile: auth)
# Run after setup-authelia.py:
#   docker compose -f compose.yaml -f compose.auth-overrides.yaml --profile auth --profile tunnel-token up -d

services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    profiles: [auth]
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: postgres
      TZ: ${TZ}
    volumes:
      - ${APPDATA_ROOT}/postgres/data:/var/lib/postgresql/data
      - ${APPDATA_ROOT}/postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - proxy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    profiles: [auth]
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - ${APPDATA_ROOT}/redis/data:/data
    networks:
      - proxy
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  authelia:
    image: authelia/authelia:latest
    container_name: authelia
    restart: unless-stopped
    profiles: [auth]
    environment:
      TZ: ${TZ}
    volumes:
      - ${APPDATA_ROOT}/authelia:/config
    networks:
      - proxy
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.http.routers.authelia.rule=Host(`${SUBDOMAIN_AUTH}.${DOMAIN}`)
      - traefik.http.routers.authelia.entrypoints=web
      - traefik.http.services.authelia.loadbalancer.server.port=9091
