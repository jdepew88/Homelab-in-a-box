# Traefik-only stack (from install_traefik_compose)
# Optional standalone install — NOT used by ../scripts/compose.sh
#
# Homelab-in-a-box full stack: use ../scripts/compose.sh from repo root instead.
# Requires external network: docker network create proxy

services:
  traefik:
    container_name: traefik
    image: traefik:v3.3
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "8183:8080"
    volumes:
      - ${TRAEFIK_APPDATA:-/opt/appdata/docker-apps/traefik}:/etc/traefik
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - proxy
    environment:
      CF_DNS_API_TOKEN: ${TRAEFIK_CF_DNS_API_TOKEN:-}
      DOMAIN_NAME: ${DOMAIN_NAME}
      EMAIL: ${EMAIL}
    labels:
      - traefik.enable=true
      - traefik.http.routers.api.rule=Host(`traefik.${DOMAIN_NAME}`)
      - traefik.http.routers.api.entrypoints=https
      - traefik.http.routers.api.service=api@internal
    depends_on:
      - dockersocket

  dockersocket:
    container_name: dockersocket
    image: ghcr.io/tecnativa/docker-socket-proxy:latest
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - proxy

networks:
  proxy:
    external: true
